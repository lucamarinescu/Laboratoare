<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Laboratorul 3 – Stiluri CSS</title>
  <style>
    .exercitii {
      display: flex;
      flex-wrap: nowrap;
      gap: 10px;
      margin: 0 0 20px;
      padding: 0;
      list-style: none;
    }

    .exercitii a {
      display: block;
      padding: 10px 16px;
      border-radius: 8px;
      color: white;
      text-decoration: none;
      transition: transform 0.2s, filter 0.2s;
    }

    .exercitii a:hover {
      filter: brightness(0.8);
      transform: translateY(-2px);
    }

    .inline a {
      background-color: #dc2626;
    }

    .internal a {
      background-color: #16a34a;
    }

    .external a {
      background-color: #2563eb;
    }

    .indicatii a {
      background-color: #9333ea;
    }

    .laboratoare a {
      background-color: #475569;
    }
  </style>
</head>
<body>
  <h1>Laboratorul 3 – stiluri CSS</h1>
  <ul class="exercitii">
    <li class="indicatii"><a href="FormtareText.html">Indicații</a></li>
    <li class="inline"><a href="FormtareText_inline.html">Stiluri inline</a></li>
    <li class="internal"><a href="FormtareText_internal.html">Stiluri interne</a></li>
    <li class="external"><a href="FormtareText_external.html">Stiluri externe</a></li>
    <li class="laboratoare"><a href="../index.html">Laboratoarele mele</a></li>
  </ul>
</body>
</html>
