<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Tabel masini</title>
<style>
table {
  font-family: arial, sans-serif;
  border-collapse: collapse;
  width: 100%;
}

td, th {
  border: 1px solid #dddddd;
  text-align: left;
  padding: 8px;
}

#mesaj {
  color: red;
}
</style>
</head>
<body>
<h1 > Masinile dorite </h1>

<form onsubmit="return adaugaMasina()">
  <input id="marca" placeholder="Marca" required>
  <input id="model" placeholder="Model" required>
  <input id="culoare" placeholder="Culoare" required>
  <input id="anFab" type="number" placeholder="An fabricatie" required>
  <button type="submit">Adauga masina</button>
</form>
<p id="mesaj"></p>

<table id="tm">
  <tr>
    <th>Marca</th> <th>Model</th> <th>Culoare</th> <th>An fabricatie</th>
  </tr>
</table>
<script>
const masini2Store = [];
if (localStorage.carsArray) {
  var arrayJSON = localStorage.carsArray;
  var masiniStored = JSON.parse(arrayJSON);
  for (var i = 0; i < masiniStored.length; i++) {
    document.getElementById("tm").innerHTML += masiniStored[i].randNou; // proprietate
    masini2Store.push(masiniStored[i]);
  }
}

function masina(mk, md, cl, an){
  this.marca = mk;
  this.model = md;
  this.culoare = cl;
  this.anFab = an;
  this.randNou = function() {
    return "<tr><td>" + this.marca + "</td><td>" + this.model +
      "</td><td>" + this.culoare + "</td><td>" + this.anFab + "</td></tr>";
  };
}

function valideaza(marca, model, culoare, an) {
  if (marca.trim() === "") {
    return "Marca nu poate fi goală sau formată doar din spații.";
  }
  if (model.trim() === "") {
    return "Modelul nu poate fi gol sau format doar din spații.";
  }
  if (culoare.trim() === "") {
    return "Culoarea nu poate fi goală sau formată doar din spații.";
  }
  var anNum = Number(an);
  var anCurent = new Date().getFullYear();
  if (!Number.isInteger(anNum) || anNum < 1900 || anNum > anCurent) {
    return "Anul trebuie să fie un număr întreg între 1900 și " + anCurent + ".";
  }
  return "";
}

function adaugaMasina() {
  var marca = document.getElementById("marca").value;
  var model = document.getElementById("model").value;
  var culoare = document.getElementById("culoare").value;
  var an = document.getElementById("anFab").value;
  var eroare = valideaza(marca, model, culoare, an);
  var mesaj = document.getElementById("mesaj");
  if (eroare !== "") {
    mesaj.innerHTML = eroare;
    return false;
  }
  mesaj.innerHTML = "";
  marca = marca.trim();
  model = model.trim();
  culoare = culoare.trim();
  an = Number(an);
  var mNoua = new masina(marca, model, culoare, an);
  document.getElementById("tm").innerHTML += mNoua.randNou();
  mNoua.randNou = mNoua.randNou().toString();
  masini2Store.push(mNoua);
  var myJSON = JSON.stringify(masini2Store);
  localStorage.setItem("carsArray", myJSON);
  return false;
}
</script>

<!--
Exercițiul 6

Față de L8_B, aici se păstrează mai multe mașini:
- masini2Store este un tablou cu toate mașinile.
- carsArray este cheia din Local Storage unde se salvează tot tabloul, ca text JSON.
- La încărcare, bucla pune în tabel fiecare mașină și o pune înapoi în masini2Store,
  ca la o adăugare nouă să nu se piardă cele vechi.
După reîncărcare apar toate mașinile, în ordinea în care au fost adăugate.
-->
</body>
</html>
