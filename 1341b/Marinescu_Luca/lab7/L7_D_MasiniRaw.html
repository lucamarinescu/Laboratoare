<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <title>Masini - versiune "bruta"</title>
	<script>
// "masina" JS
function loadMjs(){
document.getElementById("mjs").innerHTML =
"<ul>"+
"<li>Tip:  Dacia</li>" +
"<li>Model:  Logan</li>" +
"<li>Culoare:  verde</li>" +
"</ul>";
}

function afiseazaMasina(depozit, id) {
	var tip = depozit.getItem("tip");
	var model = depozit.getItem("model");
	var culoare = depozit.getItem("culoare");
	if (!tip || !model || !culoare) {
		document.getElementById(id).innerHTML = "Nicio mașină salvată";
		return;
	}
	document.getElementById(id).innerHTML =
	"<ul>"+
	"<li>Tip: " + tip +"</li>" +
	"<li>Model: "  + model +"</li>" +
	"<li>Culoare: "  + culoare + "</li>" +
	"</ul>";
}

function salveazaMls() {
	localStorage.setItem("tip", document.getElementById("tipL").value);
	localStorage.setItem("model", document.getElementById("modelL").value);
	localStorage.setItem("culoare", document.getElementById("culoareL").value);
	afiseazaMasina(localStorage, "mls");
	return false;
}

function stergeMls() {
	localStorage.removeItem("tip");
	localStorage.removeItem("model");
	localStorage.removeItem("culoare");
	document.getElementById("tipL").value = "";
	document.getElementById("modelL").value = "";
	document.getElementById("culoareL").value = "";
	afiseazaMasina(localStorage, "mls");
}

function salveazaMss() {
	sessionStorage.setItem("tip", document.getElementById("tipS").value);
	sessionStorage.setItem("model", document.getElementById("modelS").value);
	sessionStorage.setItem("culoare", document.getElementById("culoareS").value);
	afiseazaMasina(sessionStorage, "mss");
	return false;
}

function stergeMss() {
	sessionStorage.removeItem("tip");
	sessionStorage.removeItem("model");
	sessionStorage.removeItem("culoare");
	document.getElementById("tipS").value = "";
	document.getElementById("modelS").value = "";
	document.getElementById("culoareS").value = "";
	afiseazaMasina(sessionStorage, "mss");
}

function laDeschidere() {
	afiseazaMasina(localStorage, "mls");
	afiseazaMasina(sessionStorage, "mss");
}
</script>
</head>
<body onload="laDeschidere()">
<div style="background-color:LimeGreen;color:white;font-size:200%" onclick="loadMjs()">
<p>Masina JavaScript</p>
	<div id="mjs"></div>
</div>

<div style="background-color:ForestGreen;color:white;font-size:200%">
	<p>Masina Local Storage</p>
	<form onsubmit="return salveazaMls()">
		<label for="tipL">Tip</label> <input id="tipL" required><br>
		<label for="modelL">Model</label> <input id="modelL" required><br>
		<label for="culoareL">Culoare</label> <input id="culoareL" required><br>
		<button type="submit">Salvează</button>
		<button type="button" onclick="stergeMls()">Șterge</button>
	</form>
	<div id="mls"></div>
</div>

<div style="background-color:SeaGreen;color:white;font-size:200%">
	<p>Masina Session Storage</p>
	<form onsubmit="return salveazaMss()">
		<label for="tipS">Tip</label> <input id="tipS" required><br>
		<label for="modelS">Model</label> <input id="modelS" required><br>
		<label for="culoareS">Culoare</label> <input id="culoareS" required><br>
		<button type="submit">Salvează</button>
		<button type="button" onclick="stergeMss()">Șterge</button>
	</form>
	<div id="mss"></div>
</div>

</body>
</html>
